[package]
name = "macrokey"
version = "0.1.0"
edition = "2021"
description = "Open configurator for the 6-key + knob macro keyboard (VID 0x1189): GUI, CLI and TOML profiles, without the vendor software"
authors = ["Daniel Tobón <danieltobon21@users.noreply.github.com>"]
repository = "https://github.com/danieltobon21/macro-key-setup"
license = "MIT"
keywords = ["hid", "keyboard", "macro", "usb", "egui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }

# Linux: libc para los ioctl de USBDEVFS (transporte usbfs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: API HID nativa (no hay /dev/hidraw ni usbfs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    # CreateFileW/WriteFile arrastran estos dos modulos en su firma
    "Win32_Security",
    "Win32_System_IO",
    # ocultar la ventana de consola cuando se abre la GUI con doble clic
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

# Sólo en Windows: incrusta el icono en el .exe (necesita rc.exe o windres)
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
