name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            bin: rust/target/release/macrokey
          - os: windows-latest
            name: windows-x64
            bin: rust/target/release/macrokey.exe

    steps:
      - uses: actions/checkout@v4

      # eframe/egui en Linux necesita las cabeceras de X11/Wayland/GL
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compilar
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Comprobar que el binario arranca (--version)
        run: ${{ matrix.bin }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: macrokey-${{ matrix.name }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bin }}
          generate_release_notes: true
